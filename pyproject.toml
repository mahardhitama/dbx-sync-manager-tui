[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbx-sync-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["textual", "dropbox"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
dbx-sync-manager = "dbx_sync_manager.__main__:main"

[tool.setuptools]
packages = ["dbx_sync_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
